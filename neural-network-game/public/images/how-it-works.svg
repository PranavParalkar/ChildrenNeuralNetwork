<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <!-- Background -->
  <rect width="800" height="400" rx="16" fill="#0a0a1a"/>
  
  <!-- Connection lines -->
  <line x1="220" y1="200" x2="380" y2="200" stroke="#4b5563" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="520" y1="200" x2="680" y2="200" stroke="#4b5563" stroke-width="2" stroke-dasharray="6 4"/>
  
  <!-- Arrows -->
  <polygon points="375,195 385,200 375,205" fill="#4b5563"/>
  <polygon points="675,195 685,200 675,205" fill="#4b5563"/>
  
  <!-- Input Layer Group -->
  <rect x="60" y="100" width="160" height="200" rx="16" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="140" cy="145" r="24" fill="#3b82f6" opacity="0.3"/>
  <circle cx="140" cy="145" r="8" fill="#3b82f6"/>
  <text x="140" y="185" text-anchor="middle" fill="#93c5fd" font-size="14" font-weight="bold">Input Layer</text>
  <text x="140" y="210" text-anchor="middle" fill="#9ca3af" font-size="11">See an image</text>
  <text x="140" y="228" text-anchor="middle" fill="#9ca3af" font-size="11">Type ONE word</text>
  <text x="140" y="246" text-anchor="middle" fill="#9ca3af" font-size="11">to describe it</text>
  <rect x="90" y="262" width="100" height="24" rx="8" fill="#3b82f6" opacity="0.2"/>
  <text x="140" y="278" text-anchor="middle" fill="#60a5fa" font-size="10" font-weight="bold">56% of players</text>
  
  <!-- Hidden Layer Group -->
  <rect x="360" y="100" width="160" height="200" rx="16" fill="#3b1f5e" stroke="#a855f7" stroke-width="2"/>
  <circle cx="440" cy="145" r="24" fill="#a855f7" opacity="0.3"/>
  <circle cx="440" cy="145" r="8" fill="#a855f7"/>
  <text x="440" y="185" text-anchor="middle" fill="#d8b4fe" font-size="14" font-weight="bold">Hidden Layer</text>
  <text x="440" y="210" text-anchor="middle" fill="#9ca3af" font-size="11">See top words</text>
  <text x="440" y="228" text-anchor="middle" fill="#9ca3af" font-size="11">Form a TWO-word</text>
  <text x="440" y="246" text-anchor="middle" fill="#9ca3af" font-size="11">phrase from them</text>
  <rect x="390" y="262" width="100" height="24" rx="8" fill="#a855f7" opacity="0.2"/>
  <text x="440" y="278" text-anchor="middle" fill="#c084fc" font-size="10" font-weight="bold">40% of players</text>
  
  <!-- Output Layer Group -->
  <rect x="660" y="100" width="160" height="200" rx="16" fill="#4a2c17" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="740" cy="145" r="24" fill="#f59e0b" opacity="0.3"/>
  <circle cx="740" cy="145" r="8" fill="#f59e0b"/>
  <text x="740" y="185" text-anchor="middle" fill="#fcd34d" font-size="14" font-weight="bold">Output Layer</text>
  <text x="740" y="210" text-anchor="middle" fill="#9ca3af" font-size="11">See top phrases</text>
  <text x="740" y="228" text-anchor="middle" fill="#9ca3af" font-size="11">Write a full</text>
  <text x="740" y="246" text-anchor="middle" fill="#9ca3af" font-size="11">sentence from them</text>
  <rect x="690" y="262" width="100" height="24" rx="8" fill="#f59e0b" opacity="0.2"/>
  <text x="740" y="278" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="bold">4% of players</text>
  
  <!-- Title -->
  <text x="400" y="45" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">How the Neural Network Works</text>
  <text x="400" y="68" text-anchor="middle" fill="#6b7280" font-size="12">Each player is randomly assigned to one layer</text>
  
  <!-- Flow labels -->
  <text x="300" y="185" text-anchor="middle" fill="#6b7280" font-size="10">Top 25</text>
  <text x="300" y="198" text-anchor="middle" fill="#6b7280" font-size="10">words</text>
  <text x="600" y="185" text-anchor="middle" fill="#6b7280" font-size="10">Top 10</text>
  <text x="600" y="198" text-anchor="middle" fill="#6b7280" font-size="10">phrases</text>
  
  <!-- Bottom result -->
  <rect x="250" y="340" width="300" height="40" rx="12" fill="#1f2937" stroke="#4b5563" stroke-width="1"/>
  <text x="400" y="365" text-anchor="middle" fill="#d1d5db" font-size="12">Top 5 sentences shown at the end!</text>
</svg>
